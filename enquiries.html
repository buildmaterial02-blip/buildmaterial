<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Enquiries — BuildMaterial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --saffron:#FF9933; --saffron-dark:#E67E22; --ink:#1C1C1E; --ink-soft:#5B5B60;
    --bg:#FFFDF9; --card:#FFFFFF; --line:#EFE6DA; --green:#2F8F5B; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:70px;}
  h1,.brand{font-family:'Poppins',sans-serif;}

  .topbar{
    position:sticky; top:0; z-index:50; background:var(--card); border-bottom:1px solid var(--line);
    padding:14px 16px;
  }
  .brand{font-size:16px; font-weight:700;}

  .enquiry-list{padding:4px 16px;}
  .enquiry-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
    margin-bottom:12px;
  }
  .eq-top{display:flex; justify-content:space-between; align-items:center;}
  .eq-shop{font-weight:700; font-size:14.5px;}
  .eq-status{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px;}
  .eq-status.New{background:#FFF4E3; color:#8A5A17;}
  .eq-status.Contacted{background:#EAF2FF; color:#2563EB;}
  .eq-status.Quoted{background:#F3E8FF; color:#7C3AED;}
  .eq-status.Completed{background:#EAF7EF; color:var(--green);}

  .eq-msg{font-size:13px; color:var(--ink-soft); margin-top:8px;}
  .eq-time{font-size:11px; color:var(--ink-soft); margin-top:8px;}

  .empty-note{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13.5px;}

  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
    display:flex; z-index:60; padding:6px 0 8px;
  }
  .bottomnav a{flex:1; text-align:center; text-decoration:none; color:var(--ink-soft); font-size:11px; font-weight:500;}
  .bottomnav a.active{color:var(--saffron-dark); font-weight:700;}
  .bottomnav .nav-icon{font-size:19px; display:block; margin-bottom:2px;}
</style>
</head>
<body>

<div class="topbar"><div class="brand">My Enquiries</div></div>

<div class="enquiry-list" id="enquiryList">
  <div class="empty-note">Loading your enquiries...</div>
</div>

<div class="bottomnav">
  <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a href="search.html"><span class="nav-icon">🔍</span>Search</a>
  <a href="calculator.html"><span class="nav-icon">🧮</span>Calculator</a>
  <a href="profile.html" class="active"><span class="nav-icon">👤</span>Profile</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAh424CiFY1bR6iSrnQ3W7Gm3ITphkt1bY",
    authDomain: "build-material-6cddd.firebaseapp.com",
    projectId: "build-material-6cddd",
    storageBucket: "build-material-6cddd.firebasestorage.app",
    messagingSenderId: "569135726307",
    appId: "1:569135726307:web:0387f0344d7aa852134fd6"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const listEl = document.getElementById('enquiryList');

  // Enquiries sent from this device are saved here by shop.html after a successful submit:
  // [{ shopId, enquiryId, shopName, message, time }, ...]
  function getSavedEnquiries(){
    try{
      const raw = localStorage.getItem('bm_myEnquiries');
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  async function render(){
    const saved = getSavedEnquiries();

    if(saved.length === 0){
      listEl.innerHTML = `<div class="empty-note">You haven't sent any enquiries yet. Visit a shop and tap "Send Enquiry" to get started.</div>`;
      return;
    }

    // Newest first
    saved.sort((a,b)=> new Date(b.time) - new Date(a.time));

    listEl.innerHTML = '';
    for(const item of saved){
      let status = 'New';
      try{
        const snap = await getDoc(doc(db, "businesses", item.shopId, "enquiries", item.enquiryId));
        if(snap.exists()){
          status = snap.data().status || 'New';
        }
      }catch(err){
        console.error(err);
      }

      const card = document.createElement('div');
      card.className = 'enquiry-card';
      card.innerHTML = `
        <div class="eq-top">
          <span class="eq-shop">${item.shopName || 'Shop'}</span>
          <span class="eq-status ${status}">${status}</span>
        </div>
        <div class="eq-msg">${item.message || ''}</div>
        <div class="eq-time">${item.time ? new Date(item.time).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : ''}</div>
      `;
      listEl.appendChild(card);
    }
  }

  render();
</script>
</body>
  </html>
