<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopkeeper Login — BuildMaterial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --saffron:#FF9933; --saffron-dark:#E67E22; --ink:#1C1C1E; --ink-soft:#5B5B60;
    --bg:#FFFDF9; --card:#FFFFFF; --line:#EFE6DA; --green:#2F8F5B; --red:#D64545;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column;
  }
  .topbar{
    padding:14px 16px; display:flex; align-items:center; gap:10px;
  }
  .back-link{font-size:20px; text-decoration:none; color:var(--ink);}
  .brand{font-family:'Poppins',sans-serif; font-size:17px; font-weight:700;}

  .wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px 24px 60px;}
  .logo-row{text-align:center; margin-bottom:28px;}
  .logo-row .icon{font-size:40px;}
  .logo-row h1{font-family:'Poppins',sans-serif; font-size:22px; font-weight:800; margin-top:8px;}
  .logo-row p{font-size:13.5px; color:var(--ink-soft); margin-top:4px;}

  .field{margin-bottom:16px;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  input{
    width:100%; padding:13px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:15px; font-family:'Inter',sans-serif; background:#FBF8F3;
  }
  input:focus{outline:none; border-color:var(--saffron);}

  .btn-solid{
    width:100%; padding:14px; border-radius:12px; border:none; background:var(--saffron);
    color:#fff; font-size:15px; font-weight:700; font-family:'Inter',sans-serif; margin-top:6px;
  }
  .btn-solid:disabled{opacity:.6;}

  .msg{font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none;}
  .msg.error{background:#FDEDED; color:var(--red); display:block;}
  .msg.info{background:#FFF4E3; color:#8A5A17; display:block;}

  .below-links{text-align:center; margin-top:20px; font-size:13.5px; color:var(--ink-soft);}
  .below-links a{color:var(--saffron-dark); font-weight:600; text-decoration:none;}

  .divider{text-align:center; margin:14px 0; color:var(--ink-soft); font-size:12px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-link">←</a>
  <div class="brand">BuildMaterial</div>
</div>

<div class="wrap">
  <div class="logo-row">
    <div class="icon">🏪</div>
    <h1>Shopkeeper Login</h1>
    <p>Manage your shop, products and enquiries</p>
  </div>

  <div id="formMsg" class="msg"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Your password">
    </div>
    <button type="submit" class="btn-solid" id="loginBtn">Log In</button>
  </form>

  <div class="divider">— OR —</div>

  <div class="below-links">
    New shop owner? <a href="shopkeeper-register.html">Register your business</a>
  </div>
  <div class="below-links" style="margin-top:8px;">
    <a href="shopkeeper-forgot-password.html">Forgot password?</a>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAh424CiFY1bR6iSrnQ3W7Gm3ITphktlbY",
    authDomain: "build-material-6cddd.firebaseapp.com",
    projectId: "build-material-6cddd",
    storageBucket: "build-material-6cddd.firebasestorage.app",
    messagingSenderId: "569135726307",
    appId: "1:569135726307:web:0387f0344d7aa852134fd6"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById('loginForm');
  const formMsg = document.getElementById('formMsg');
  const loginBtn = document.getElementById('loginBtn');

  function showMsg(text, type){
    formMsg.textContent = text;
    formMsg.className = `msg ${type}`;
  }

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";
    showMsg("Checking your details...", "info");

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try{
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const uid = userCredential.user.uid;

      // Confirm this account has a business profile (not a customer account)
      const bizDoc = await getDoc(doc(db, "businesses", uid));
      if(!bizDoc.exists()){
        showMsg("No business account found for this login. Please register your business first.", "error");
        loginBtn.disabled = false;
        loginBtn.textContent = "Log In";
        return;
      }

      window.location.href = "shopkeeper-dashboard.html";

    }catch(err){
      console.error(err);
      let message = "Login failed. Please try again.";
      if(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") message = "Incorrect email or password.";
      if(err.code === "auth/user-not-found") message = "No account found with this email.";
      if(err.code === "auth/too-many-requests") message = "Too many attempts. Please wait a bit and try again.";
      showMsg(message, "error");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
